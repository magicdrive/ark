name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # QUALITY GATES: exactly the CI of every push to main — tests, race,
  # staticcheck, fuzz smoke and the TypeScript compiler differential.
  ci:
    uses: ./.github/workflows/ci.yml

  # RELEASE SMOKE: the GoReleaser configuration, and the artifacts it builds,
  # before any of them is published.
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v1'
          args: check

      - name: Build snapshot artifacts (nothing is published)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v1'
          args: release --snapshot --clean --skip=publish

      - name: Verify artifacts
        run: .github/release/verify-dist.sh dist

  # RELEASE: only when every gate above passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
