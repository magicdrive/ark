name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The release workflow runs these same gates before it publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: |
          # Exclude testdata: fixtures are not real source and some are
          # intentionally malformed (e.g. internal/golden/testdata/go/broken.go
          # freezes broken-source extraction behavior and must not be parseable).
          files=$(git ls-files '*.go' | grep -v '/testdata/' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "gofmt found unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Install zsh (shell completion tests)
        # internal/completion runs the completion scripts under real bash and
        # zsh; without zsh those subtests are skipped.
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        # The descriptor-anchored file access tests (internal/fsroot,
        # internal/accesspolicy) need symlinks: make their absence a failure,
        # not a skip.
        env:
          ARK_REQUIRE_SYMLINKS: "1"
        run: go test -race ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck (intelligence core)
        run: |
          staticcheck \
            ./internal/cache/... \
            ./internal/context/... \
            ./internal/index/... \
            ./internal/resolver/... \
            ./internal/language/... \
            ./internal/languages/... \
            ./internal/mcp/... \
            ./internal/symbol/... \
            ./internal/reference/... \
            ./internal/repomap/... \
            ./internal/impact/... \
            ./internal/search/... \
            ./internal/fsroot/... \
            ./internal/accesspolicy/...

      # -fuzz is a regexp that must match exactly one fuzz test per run:
      # anchor every pattern.
      - name: Run fuzz smoke (path containment)
        run: go test -run '^$' -fuzz='^FuzzResolveToolPath$' -fuzztime=10s ./internal/mcp/

      - name: Run fuzz smoke (path containment, physical root)
        run: go test -run '^$' -fuzz='^FuzzResolveToolPath_PhysicalRoot$' -fuzztime=10s ./internal/mcp/

      - name: Run fuzz smoke (symbol search matching)
        run: go test -run '^$' -fuzz='^FuzzMatchSymbols$' -fuzztime=10s ./internal/search/

      - name: Run fuzz smoke (declaration identity)
        run: go test -run '^$' -fuzz='^FuzzDeclarationIdentity$' -fuzztime=10s ./internal/index/

      - name: Run fuzz smoke (parent identity)
        run: go test -run '^$' -fuzz='^FuzzParentIdentity$' -fuzztime=10s ./internal/index/

      - name: Run fuzz smoke (SymbolID collision detection)
        run: go test -run '^$' -fuzz='^FuzzIdentityCollision$' -fuzztime=10s ./internal/index/

      - name: Run fuzz smoke (cache decode)
        run: go test -fuzz=FuzzCacheDecoding -fuzztime=10s ./internal/cache/

      - name: Run fuzz smoke (extraction)
        run: go test -fuzz=FuzzExtract -fuzztime=10s ./internal/languages/golang/

      - name: Run fuzz smoke (PHP extraction)
        run: go test -fuzz=FuzzExtractPHP -fuzztime=10s ./internal/languages/php/

      - name: Run fuzz smoke (TypeScript/TSX extraction)
        run: go test -run '^$' -fuzz=FuzzExtractTypeScript -fuzztime=10s ./internal/languages/typescript/

      - name: Run fuzz smoke (TypeScript module specifiers)
        run: go test -run '^$' -fuzz=FuzzModuleSpec -fuzztime=10s ./internal/languages/typescript/

      - name: Run fuzz smoke (TypeScript type arguments)
        run: go test -run '^$' -fuzz='^FuzzTypeArgParser$' -fuzztime=10s ./internal/languages/typescript/

      - name: Run fuzz smoke (Terraform extraction)
        run: go test -run '^$' -fuzz=FuzzExtractTerraform -fuzztime=10s ./internal/languages/terraform/

  # The descriptor-anchored file access foundation (internal/fsroot,
  # internal/accesspolicy) and the case-insensitive name tests (C1: the MCP
  # path gate, MCP walks, the dump) on the systems whose file systems fold
  # names: Windows (os.Root and object identities instead of openat; NTFS)
  # and macOS (APFS, case-insensitive by default, plus a case-sensitive
  # volume for the C1-6 tests). Linux runs the same tests in the test job,
  # where the case-folding ones skip (ext4 is case-sensitive). Symlinks and
  # case folding are required here: a skip for either fails the job; skips
  # for attacks the system itself refuses are listed.
  filesystem-security:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Create a case-sensitive volume (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 64m -fs "Case-sensitive APFS" -volname arkcs "$RUNNER_TEMP/cs.dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/csvol" "$RUNNER_TEMP/cs.dmg"
          echo "ARK_CASE_SENSITIVE_DIR=$RUNNER_TEMP/csvol" >> "$GITHUB_ENV"

      - name: Run file access security tests (race detector)
        shell: bash
        env:
          ARK_REQUIRE_SYMLINKS: "1"
          ARK_REQUIRE_CASE_FOLDING: "1"
        run: |
          set -o pipefail
          go test -race -count=1 -v ./internal/fsroot ./internal/accesspolicy | tee fsroot-test.log
          go test -count=1 -v -race -run 'TestCase_|TestB[0-9]|TestMCPCase_|TestCLICase_' ./internal/mcp . | tee -a fsroot-test.log

      - name: List skipped tests
        if: always()
        shell: bash
        run: grep -E -- '--- SKIP|SKIP:|KNOWN-GAP' fsroot-test.log || echo "no skipped tests or known gaps"

  # The TypeScript compiler differential: Ark's TypeScript readings compared
  # with the pinned compiler (.github/ts-oracle). Node.js and TypeScript are
  # CI-only; Ark never depends on them. The tests skip without a compiler, so
  # this job makes them required: no compiler, the wrong version, a skip or a
  # mismatch fails it.
  typescript-compiler-differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.0'

      - name: Run TypeScript compiler differential
        run: .github/ts-oracle/run.sh
