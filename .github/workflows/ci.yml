name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: |
          # Exclude testdata: fixtures are not real source and some are
          # intentionally malformed (e.g. internal/golden/testdata/go/broken.go
          # freezes broken-source extraction behavior and must not be parseable).
          files=$(git ls-files '*.go' | grep -v '/testdata/' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "gofmt found unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck (intelligence core)
        run: |
          staticcheck \
            ./internal/cache/... \
            ./internal/context/... \
            ./internal/index/... \
            ./internal/resolver/... \
            ./internal/language/... \
            ./internal/languages/... \
            ./internal/mcp/... \
            ./internal/symbol/... \
            ./internal/reference/... \
            ./internal/repomap/... \
            ./internal/impact/... \
            ./internal/search/...

      - name: Run fuzz smoke (path containment)
        run: go test -fuzz=FuzzResolveToolPath -fuzztime=10s ./internal/mcp/

      - name: Run fuzz smoke (cache decode)
        run: go test -fuzz=FuzzCacheDecoding -fuzztime=10s ./internal/cache/

      - name: Run fuzz smoke (extraction)
        run: go test -fuzz=FuzzExtract -fuzztime=10s ./internal/languages/golang/

      - name: Run fuzz smoke (PHP extraction)
        run: go test -fuzz=FuzzExtractPHP -fuzztime=10s ./internal/languages/php/

      - name: Run fuzz smoke (TypeScript/TSX extraction)
        run: go test -run '^$' -fuzz=FuzzExtractTypeScript -fuzztime=10s ./internal/languages/typescript/

      - name: Run fuzz smoke (TypeScript module specifiers)
        run: go test -run '^$' -fuzz=FuzzModuleSpec -fuzztime=10s ./internal/languages/typescript/
