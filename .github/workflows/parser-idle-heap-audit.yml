name: Parser idle heap audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  idle-heap:
    if: github.event.pull_request.number == 120
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Measure idle parser retention
        env:
          ARK_POOL_HEAP_PROBE: "1"
        run: go test ./internal/tsparse -run '^TestProductionPool_IdleHeap$' -count=1 -v
