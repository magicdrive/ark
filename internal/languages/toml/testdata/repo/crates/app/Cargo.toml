[package]
name = "app"
version = "0.3.1"
edition = "2021"

[dependencies]
core = { path = "../core", package = "core-lib" }
serde = { workspace = true }
regex = "1"
json = { package = "serde_json", version = "1" }
private = { git = "https://user:pass@example.com/org/private.git?token=abc", branch = "main" }
outside = { path = "../../../outside" }
libc = { version = "0.2", optional = true }

[dependencies.log]
version = "0.4"
registry = "internal"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["std"]
std = ["dep:libc", "regex/std", "serde?/std"]
fast = ["missing"]

[[bin]]
name = "app-cli"
path = "src/main.rs"

[[bin]]
path = "src/other.rs"
