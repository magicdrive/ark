[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-pkg"
version = "1.2.0"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "Regex; python_version < '3.8'",
  "regex>=2023",
  "  >=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[dependency-groups]
test = ["coverage[toml]", { include-group = "dev" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
